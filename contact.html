<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Late Night Ricky</title>
<meta name="description" content="Book Late Night Ricky - International DJ & Grammy Winning Producer. Enquiries: samir@wearemediahive.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gd:#1B3A4C;--gs:#8FA8BE;--gm:#6B8FAB;--gl:#A3B5C4;--cr:#E3E8ED;--wh:#fff;--bk:#111;--fs:'Playfair Display',serif;--fn:'Inter',sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--fn);color:var(--bk);background:var(--wh);overflow-x:hidden}

/* Page Nav */
.page-nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;background:var(--gd)}
.page-nav .nav-logo img{height:28px;width:auto;filter:brightness(0) invert(1)}
.page-nav .nav-links{display:none;gap:28px;align-items:center}
.page-nav .nav-links a{color:var(--wh);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;transition:opacity .3s}
.page-nav .nav-links a:hover{opacity:.7}
.page-nav .nav-links a.active{opacity:.6}
.hamburger-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;transition:all .3s}
.hamburger-btn:hover{border-color:var(--wh);background:rgba(255,255,255,.1)}
.hamburger-btn span{display:block;width:18px;height:2px;background:var(--wh);border-radius:1px;margin:3px 0}
@media(min-width:992px){.page-nav .nav-links{display:flex}.hamburger-btn{display:none}}

/* Mobile menu */
.mobile-menu{position:fixed;inset:0;background:var(--gd);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateX(100%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu .close-btn{position:absolute;top:16px;right:30px;width:44px;height:44px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--wh);font-size:24px}
.mobile-menu a{display:block;color:var(--wh);text-decoration:none;font-family:var(--fs);font-size:28px;font-weight:500;padding:14px 0;letter-spacing:2px;text-transform:uppercase;transition:opacity .3s}
.mobile-menu a:hover{opacity:.6}

/* Page Title */
.page-title-bar{padding:100px 30px 20px;border-bottom:2px solid var(--bk)}
.page-title{font-family:var(--fn);font-size:clamp(48px,10vw,120px);font-weight:900;letter-spacing:-3px;text-transform:uppercase;line-height:.9;color:var(--bk);max-width:1200px;margin:0 auto}

/* Split Layout */
.split-layout{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 200px)}
.split-left{position:relative;overflow:hidden}
.split-left img{width:100%;height:100%;object-fit:cover;object-position:center top}
.split-right{padding:60px;display:flex;flex-direction:column;justify-content:center}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:40px}
.tab-btn{padding:14px 28px;border:2px solid var(--bk);background:var(--wh);font-family:var(--fn);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .3s}
.tab-btn.active{background:var(--bk);color:var(--wh)}
.tab-btn:not(.active):hover{background:var(--cr)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Form */
.form-group{margin-bottom:28px}
.form-group label{display:block;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.form-group input, .form-group textarea, .form-group select{width:100%;border:none;border-bottom:2px solid var(--bk);padding:12px 0;font-size:15px;font-family:var(--fn);background:transparent;outline:none;transition:border-color .3s}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus{border-bottom-color:var(--gd)}
.form-group textarea{resize:vertical;min-height:80px}
.submit-btn{width:100%;padding:16px;background:var(--bk);color:var(--wh);border:none;font-family:var(--fn);font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .3s;margin-top:10px}
.submit-btn:hover{background:var(--gd)}

/* Footer */
.page-footer{background:var(--bk);padding:40px 30px;text-align:center}
.page-footer p{color:#777;font-size:13px;letter-spacing:.5px}

/* Responsive */
@media(max-width:991px){
  .split-layout{grid-template-columns:1fr}
  .split-left{min-height:50vh;max-height:60vh}
  .split-right{padding:40px 30px}
}
@media(max-width:479px){
  .page-title{font-size:40px;letter-spacing:-2px}
  .split-right{padding:30px 20px}
  .tab-btn{padding:12px 18px;font-size:11px}
}
</style>
</head>
<body>

<nav class="page-nav">
  <a href="index.html" class="nav-logo"><img src="assets/ricky-logo.png" alt="Late Night Ricky"></a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="index.html#shows">Shows</a>
    <a href="index.html#partnerships">Partners</a>
    <a href="index.html#video">Showreel</a>
    <a href="supporting-act.html">Supporting</a>
    <a href="share-music.html">Share Music</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
  <button type="button" class="hamburger-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <button type="button" class="close-btn" id="menuClose" aria-label="Close">&times;</button>
  <a href="about.html">About</a>
  <a href="index.html#shows">Shows</a>
  <a href="index.html#partnerships">Partners</a>
  <a href="index.html#video">Showreel</a>
  <a href="supporting-act.html">Supporting</a>
  <a href="share-music.html">Share Music</a>
  <a href="contact.html">Contact</a>
</div>

<div class="page-title-bar">
  <h1 class="page-title">Contact</h1>
</div>

<div class="split-layout">
  <div class="split-left">
    <img src="assets/ricky-hero-new.jpg" alt="Late Night Ricky">
  </div>
  <div class="split-right">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="booking">Booking</button>
      <button type="button" class="tab-btn" data-tab="private">Private Message</button>
    </div>

    <div class="tab-content active" id="booking">
      <form action="mailto:bookings@latenightricky.com" method="post" enctype="text/plain">
        <div class="form-group"><label for="b-name">Name*</label><input type="text" id="b-name" name="name" required></div>
        <div class="form-group"><label for="b-email">Email*</label><input type="email" id="b-email" name="email" required></div>
        <div class="form-group"><label for="b-club">Club Name*</label><input type="text" id="b-club" name="club" required></div>
        <div class="form-group"><label for="b-city">City*</label><input type="text" id="b-city" name="city" required></div>
        <div class="form-group"><label for="b-fee">Fee*</label><input type="text" id="b-fee" name="fee" required></div>
        <div class="form-group"><label for="b-date">Date*</label><input type="date" id="b-date" name="date" required></div>
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>

    <div class="tab-content" id="private">
      <form action="mailto:bookings@latenightricky.com" method="post" enctype="text/plain">
        <div class="form-group"><label for="p-name">Name*</label><input type="text" id="p-name" name="name" required></div>
        <div class="form-group"><label for="p-email">Email*</label><input type="email" id="p-email" name="email" required></div>
        <div class="form-group"><label for="p-message">Message*</label><textarea id="p-message" name="message" required></textarea></div>
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
</div>

<footer class="page-footer">
  <p>Late Night Ricky &copy; 2026. All rights reserved.</p>
</footer>

<script>
(function(){
  var menuBtn=document.getElementById('menuBtn');
  var menuClose=document.getElementById('menuClose');
  var mobileMenu=document.getElementById('mobileMenu');
  function openMenu(){mobileMenu.classList.add('open');document.body.style.overflow='hidden'}
  function closeMenu(){mobileMenu.classList.remove('open');document.body.style.overflow=''}
  menuBtn.addEventListener('click',openMenu);
  menuClose.addEventListener('click',closeMenu);
  document.querySelectorAll('.mobile-menu a').forEach(function(a){a.addEventListener('click',closeMenu)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
})();

(function(){
  var tabBtns=document.querySelectorAll('.tab-btn');
  var tabContents=document.querySelectorAll('.tab-content');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click',function(){
      var tabId=this.getAttribute('data-tab');
      tabBtns.forEach(function(b){b.classList.remove('active')});
      tabContents.forEach(function(c){c.classList.remove('active')});
      this.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    });
  });
})();
</script>

</body>
</html>
